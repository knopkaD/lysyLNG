name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/lysy/translator app/src/main/assets
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LysyTranslator"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.lysy.translator"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.lysy.translator"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Лысый переводчик"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0F0C29</color>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="linear"
                          android:startX="0" android:startY="0"
                          android:endX="108" android:endY="108">
                          <item android:offset="0" android:color="#FF7F5AF0"/>
                          <item android:offset="0.6" android:color="#FFFF4D9D"/>
                          <item android:offset="1" android:color="#FFFFB86B"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFF2C9A0" android:pathData="M29,58a5,7 0 1,0 10,0a5,7 0 1,0 -10,0z"/>
              <path android:fillColor="#FFF2C9A0" android:pathData="M69,58a5,7 0 1,0 10,0a5,7 0 1,0 -10,0z"/>
              <path android:fillColor="#FFFFE0BD" android:pathData="M34,56a20,23 0 1,0 40,0a20,23 0 1,0 -40,0z"/>
              <path android:fillColor="#D9FFFFFF" android:pathData="M41,42a7,3.5 0 1,0 14,0a7,3.5 0 1,0 -14,0z"/>
              <path android:fillColor="#FF2D2A4A" android:pathData="M44.5,58a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0z"/>
              <path android:fillColor="#FF2D2A4A" android:pathData="M58.5,58a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0z"/>
              <path android:strokeColor="#FF2D2A4A" android:strokeWidth="2.5"
                  android:strokeLineCap="round" android:pathData="M47,66q7,6 14,0"/>
          </vector>
          EOF

          cat > app/src/main/java/com/lysy/translator/MainActivity.java <<'EOF'
          package com.lysy.translator;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.HapticFeedbackConstants;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0F0C29);
                  web.setVerticalScrollBarEnabled(false);
                  web.setOverScrollMode(WebView.OVER_SCROLL_NEVER);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setTextZoom(100);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              private class Bridge {
                  @JavascriptInterface
                  public void copy(String t) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("lysy", t));
                      });
                  }
